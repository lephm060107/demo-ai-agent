version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: nexus_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexus_secret_pw}
      POSTGRES_DB: ${POSTGRES_DB:-nexus_analytics}
    ports:
      - "5432:5432"
    volumes:
      - nexus_pgdata:/var/lib/postgresql/data
      - ./nexus_analytics/db/postgres_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus_analytics"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nexus_redis
    ports:
      - "6379:6379"

  nexus_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus_analytics_app
    environment:
      NEXUS_ENV: production
      DATABASE_URL: postgresql://nexus:nexus_secret_pw@postgres:5432/nexus_analytics
      REDIS_URL: redis://redis:6379/0
      NEXUS_SECRET_KEY: ${NEXUS_SECRET_KEY:-change_me_in_production}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  nexus_pgdata:

